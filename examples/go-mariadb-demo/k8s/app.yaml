apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-mariadb-demo
  labels:
    app: go-mariadb-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-mariadb-demo
  template:
    metadata:
      labels:
        app: go-mariadb-demo
    spec:
      containers:
        - name: api
          image: go-mariadb-demo:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: APP_PORT
              value: "8080"
            - name: DB_HOST
              value: my-mariadb
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              value: root
            - name: DB_PASSWORD
              value: workshop123
            - name: DB_NAME
              value: workshop
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: go-mariadb-demo
spec:
  selector:
    app: go-mariadb-demo
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  type: ClusterIP
